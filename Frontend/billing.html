<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing - Sunrise Dental</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="dashboard">

    <aside class="sidebar">

        <div class="sidebar-brand">
            <div class="brand-icon">
                <i class="fa-solid fa-tooth"></i>
            </div>

            <div>
                <h2>Sunrise Dental</h2>
                <span>Clinic Management</span>
            </div>
        </div>

        <nav class="sidebar-nav">

            <a href="dashboard.html" class="nav-item">
                <i class="fa-solid fa-chart-line"></i>
                <span>Dashboard</span>
            </a>

            <a href="appointment.html" class="nav-item">
                <i class="fa-solid fa-calendar-check"></i>
                <span>New Appointment</span>
            </a>

            <a href="manage-appointment.html" class="nav-item">
                <i class="fa-solid fa-calendar-days"></i>
                <span>Manage Appointments</span>
            </a>

            <a href="billing.html" class="nav-item active">
                <i class="fa-solid fa-file-invoice-dollar"></i>
                <span>Billing</span>
            </a>

            <a href="help.html" class="nav-item">
                <i class="fa-solid fa-circle-question"></i>
                <span>Help</span>
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="index.html" class="nav-item logout">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>

        </div>

    </aside>

    <main class="main-content">

        <header class="topbar">

            <div>
                <h1>Billing</h1>
                <p>Create and manage dental bills</p>
            </div>

            <div class="user-profile">

                <div class="user-avatar">
                    <i class="fa-solid fa-user"></i>
                </div>

                <div class="user-info">
                    <strong>Admin</strong>
                    <span>Administrator</span>
                </div>

            </div>

        </header>

        <section class="dashboard-section billing-section">

            <div class="section-header">
                <h2>Create Bill</h2>
                <p>Enter billing information for the appointment</p>
            </div>

            <form id="billingForm">

                <div class="billing-grid">

                    <div class="form-group">

                        <label for="billNumber">
                            Bill Number
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-receipt"></i>

                            <input
                                type="text"
                                id="billNumber"
                                readonly
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="appointmentNumber">
                            Appointment Number
                            <span class="required">*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-hashtag"></i>

                            <input
                                type="text"
                                id="appointmentNumber"
                                placeholder="Enter appointment number"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="treatmentType">
                            Treatment Type
                            <span class="required">*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-tooth"></i>

                            <select
                                id="treatmentType"
                                name="treatmentType"
                                required
                            >

                                <option value="">
                                    Select Treatment
                                </option>

                                <option value="Dental Cleaning">
                                    Dental Cleaning
                                </option>

                                <option value="Teeth Whitening">
                                    Teeth Whitening
                                </option>

                                <option value="Dental Filling">
                                    Dental Filling
                                </option>

                                <option value="Root Canal Treatment">
                                    Root Canal Treatment
                                </option>

                                <option value="Tooth Extraction">
                                    Tooth Extraction
                                </option>

                                <option value="Dental Crown">
                                    Dental Crown
                                </option>

                                <option value="Dental Bridge">
                                    Dental Bridge
                                </option>

                                <option value="Dental Checkup">
                                    Dental Checkup
                                </option>

                                <option value="Braces Consultation">
                                    Braces Consultation
                                </option>

                                <option value="Dental Implant">
                                    Dental Implant
                                </option>

                                <option value="Gum Treatment">
                                    Gum Treatment
                                </option>

                                <option value="Emergency Dental Treatment">
                                    Emergency Dental Treatment
                                </option>

                            </select>

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="treatmentCost">
                            Treatment Cost
                            <span class="required">*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-money-bill-wave"></i>

                            <input
                                type="number"
                                id="treatmentCost"
                                placeholder="0.00"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="consultationFee">
                            Consultation Fee
                            <span class="required">*</span>
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-user-doctor"></i>

                            <input
                                type="number"
                                id="consultationFee"
                                placeholder="0.00"
                                min="0"
                                step="0.01"
                                required
                            >

                        </div>

                    </div>

                    <div class="form-group">

                        <label for="totalCost">
                            Total Cost
                        </label>

                        <div class="input-wrapper">

                            <i class="fa-solid fa-calculator"></i>

                            <input
                                type="number"
                                id="totalCost"
                                placeholder="0.00"
                                readonly
                            >

                        </div>

                    </div>

                </div>

                <div class="billing-actions">

                    <button
                        type="submit"
                        class="management-button billing-save-button"
                        id="saveBillButton">

                        <i class="fa-solid fa-floppy-disk"></i>
                        Save Bill

                    </button>

                    <button
                        type="button"
                        class="management-button billing-print-button"
                        id="printBillButton" >

                        <i class="fa-solid fa-print"></i>
                        Print

                    </button>

                    <button
                        type="button"
                        class="management-button billing-clear-button"
                        id="clearBillButton">

                        <i class="fa-solid fa-rotate-left"></i>
                        Clear

                    </button>

                </div>

                <p id="billingMessage"></p>

            </form>

        </section>

    </main>

</div>

<script src="js/billing.js"></script>
<script src="js/auth.js"></script>

</body>
</html>
